  QAQ-001: {target_crm_pct: 5, target_blank_pct: 3, target_field_dup_pct: 2, target_coarse_dup_pct: 2, target_pulp_dup_pct: 2, min_originals_n: 100}
  QAQ-002: {sd_warn: 2, sd_fail: 3, bias_warn_pct: 3, bias_err_pct: 5, min_n_bias: 10}
  QAQ-003: {blank_warn_x_dl: 5, blank_fail_x_dl: 10}
