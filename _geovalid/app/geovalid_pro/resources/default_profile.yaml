  ASY-008: {min_len_m: 1.0}                                       # XTB-01
  INT-011: {cov_warn_frac: 0.90, min_cov_mineralised_frac: 0.95, expected_tables: [lithology, assay]}   # XTB-05
  WTH-001: {min_inversion_m: 2, fault_buffer_m: 5}                 # XTB-06
